# figures.yml
# Single source of truth for textbook figures. Each entry is an app plus a
# state string copied from the app's "Copy figure link" button (everything
# after the #). The render step (itp render) writes figures/<name>.png; the appfig
# shortcode reads the same entry to build the click-through link.

